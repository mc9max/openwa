<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1F16"/>
      <stop offset="100%" stop-color="#1FA855"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>

  <!-- chat bubble: white rounded body + tail at lower-left -->
  <g fill="#FFFFFF">
    <rect x="150" y="210" width="500" height="360" rx="110"/>
    <path d="M 210 520 L 210 620 L 320 528 Z"/>
  </g>

  <!-- green "send / message out" arrow inside the bubble (brand accent) -->
  <g fill="#128C4A">
    <!-- shaft -->
    <rect x="290" y="372" width="180" height="36" rx="18"/>
    <!-- shaft tail notch -->
    <path d="M 290 372 L 250 390 L 290 408 Z"/>
    <!-- arrow head -->
    <path d="M 450 352 L 540 390 L 450 428 Z"/>
  </g>

  <!-- "live" dot, top-right of bubble -->
  <circle cx="560" cy="250" r="20" fill="#128C4A"/>
</svg>
